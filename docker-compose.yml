name: tku-smart-care  # 正名為智慧照護專案，展現系統完整性

services:
  # M7: 系統編排器 (中央狀態機)
  app:
    build: .
    container_name: tku-care-app-1
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./media:/media
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - ollama
      - tts
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      # 容器預設是 UTC，date.today()（見 app/routers/session.py 記錄
      # sessions.date）算出來的「今天」會比台灣時間慢 8 小時，半夜測試
      # 容易記成前一天。明確指定台灣時區，跟長者/治療師實際感受的日期一致。
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1  # 沒設的話 print() 會卡在 buffer 裡，docker logs 看不到即時輸出
    env_file:
      - .env
    restart: unless-stopped

  # M2: 本地大腦 (Llama-3)
  ollama:
    image: ollama/ollama
    container_name: tku-care-ollama-1
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib  # 強制指向掛載進來的驅動路徑
      - OLLAMA_KEEP_ALIVE=-1  # 模型常駐 GPU，不自動卸載，避免每次冷啟動要等30秒以上；
                              # 代價是永久佔用約 4.4-5GB VRAM，8GB顯卡上如果要同時開
                              # TTS/本機生圖等其他GPU服務，可用空間會變少
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  rag-service:
    build:
      context: ./Rag
      dockerfile: Dockerfile
    container_name: tku-care-rag-service-1
    volumes:
      - ./Rag:/app                                    # 程式碼熱更新，改完 restart 即生效
      - ./models/ckip_cache:/root/.cache/huggingface  # CKIP 模型只下載一次
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - qdrant
      - ollama
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - OLLAMA_HOST=http://ollama:11434
    restart: always

    # 向量資料庫
  qdrant:
    image: qdrant/qdrant
    container_name: tku-care-qdrant-1
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  # 自動備份 Qdrant：每天呼叫 snapshot API 產生一致性快照、加密後存到跟 qdrant_storage
  # 分開的獨立資料夾。內容含長者對話/情緒等個資，基於隱私考量刻意只留在本機、
  # 不同步異地或雲端；落地前一定會用 BACKUP_ENCRYPTION_PASSPHRASE 加密，沒設就直接拒絕啟動。
  # 注意：換了切分方式(chunk_size/CKIP 篩選規則)重跑 ingest 後，這份備份對應的是舊切法的向量，
  # 不會自動更新，只能拿來做災難復原/版本回溯。
  qdrant-backup:
    build: ./qdrant_backup
    container_name: tku-care-qdrant-backup-1
    volumes:
      - ./qdrant_backups:/backups
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - BACKUP_KEEP_DAYS=7
      - BACKUP_ENCRYPTION_PASSPHRASE=${QDRANT_BACKUP_PASSPHRASE}
    restart: always

  # M3: 本地語音合成 (BlueMagpie-TTS, RTX 50 系列/Blackwell 專用建置)
  tts:
    build:
      context: ./bluemagpie
      dockerfile: Dockerfile
    container_name: tku-care-tts-1
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - MODEL_ID=OpenFormosa/BlueMagpie-TTS
      - MODEL_LOCAL_DIR=/workspace/models/BlueMagpie-TTS
      - CFG_VALUE=2.0
      - INFER_STEPS=10
      - TARGET_RATE=4.0
      - TTS_SEED=42
      # 要用你自己的聲音：
      - SPEAKER_CENTROID_PT=/workspace/references/Peichi_centroid.pt
    volumes:
      - ./models/bluemagpie:/workspace/models
      - ./bluemagpie/references:/workspace/references
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # 前端 (Next.js)
  frontend:
    build:
      context: ./therapist-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: tku-care-frontend-1
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${FRONTEND_DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  # M6: 結構化與向量數據庫 (PostgreSQL)
  db:
    image: postgres:15
    container_name: tku-care-db-1
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # created_at 這類欄位是資料庫自己算的時間戳（func.now()），跟 app 服務
      # 同理需要明確設台灣時區，不然預設 UTC 會跟實際台灣時間差 8 小時。
      - TZ=Asia/Taipei
      - PGTZ=Asia/Taipei
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  # 自動備份 Postgres：每天 pg_dump 一次，壓縮後依天/週/月輪替保留，
  # 存到跟 postgres_data 分開的獨立資料夾（同一顆硬碟壞掉還是會兩邊一起沒，
  # 正式上線後應該再把 ./postgres_backups 同步一份到異地/雲端儲存）。
  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: tku-care-db-backup-1
    restart: always
    volumes:
      - ./postgres_backups:/backups
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6

  # pgAdmin 資料庫管理介面
  pgadmin:
    image: dpage/pgadmin4
    container_name: tku-care-pgadmin-1
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - db
    restart: always

  # Redis 快取
  redis:
    image: redis:alpine
    container_name: tku-care-redis-1
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always

  # Redis Insight 管理介面
  redisinsight:
    image: redis/redisinsight:latest
    container_name: tku-care-redisinsight-1
    environment:
      - RI_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - redis
    restart: always
  
  # M1: 感知數據處理服務 (OpenAI Whisper STT)
  stt:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: tku-care-stt-1
    environment:
      - WHISPER_MODEL=base  # 第一次跑建議先用 base，速度最快
      - WHISPER__TTL=-1  # 模型常駐，不閒置卸載；BELLE 微調模型冷啟動要 10 分鐘以上，
                         # 中途被卸載重載會讓 /ws/stt 最終辨識逾時、整條連線被打斷（見
                         # app/routers/ws_stt.py 的逾時例外處理）。
                         # 注意：這個 image 的 PRELOAD_MODELS 設定只會預先註冊模型名稱、
                         # 不會真的載入權重（見 model_manager.py），所以沒有加在這裡；
                         # 真正把權重載進 GPU 是靠 app 容器啟動時的暖機呼叫
                         # （app/main.py _warmup_stt），常駐則靠這裡的 ttl=-1。
    volumes:
      # 沒掛volume的話容器一重啟(重開機/更新映像)模型就要重新從HuggingFace下載一次，
      # 測試/demo當下網路不穩會很致命；掛上去讓 STT_MODEL 只下載一次。
      - ./models/whisper_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always