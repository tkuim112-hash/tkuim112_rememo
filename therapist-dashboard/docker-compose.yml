services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: m6_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d m6_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 之後加入：
  # redis:
  #   image: redis:7-alpine
  #
  # fastapi:
  #   build: ../fastapi
  #   ports:
  #     - "8000:8000"

volumes:
  postgres_data:
